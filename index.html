<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prod Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101219;--panel:#181b24;--panel-2:#1e222d;--line:rgba(255,255,255,.07);
  --text:#e8e9ee;--text-dim:#8b8f9e;--work:#5b8cff;--workout:#ff5c7a;
  --school:#b47cff;--projects:#3ddc97;--sleep:#ffcc66;--all:#ff9f43;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at top,#161923 0%,var(--bg) 55%);color:var(--text);font-family:Inter,sans-serif;min-height:100vh;padding:32px 24px 60px}
.wrap{max-width:1040px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;flex-wrap:wrap;gap:16px}
.title{font-family:Space Grotesk,sans-serif;font-weight:700;font-size:30px}.title span{color:var(--all)}
.subtitle{color:var(--text-dim);font-size:13px;margin-top:4px}
.year-nav{display:flex;align-items:center;gap:10px;font-family:JetBrains Mono,monospace}
.year-nav button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer}
.year-nav button:hover{border-color:var(--all);color:var(--all)}
.year-num{font-size:16px;font-weight:600;min-width:48px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .num{font-family:Space Grotesk,sans-serif;font-size:24px;font-weight:600}.stat .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--text-dim);padding:7px 10px 7px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:7px;transition:.15s}
.tab .dot{width:8px;height:8px;border-radius:50%}.tab.active{color:var(--text);border-color:var(--tab-color,var(--all));background:var(--panel-2);box-shadow:0 0 0 1px var(--tab-color,var(--all)) inset}.tab:hover{color:var(--text)}
.tab-edit{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;background:transparent;color:var(--text-dim);padding:0;margin-left:2px}
.tab-edit:hover{background:rgba(255,255,255,.1);color:var(--text)}
.add-cat{background:transparent;border:1px dashed var(--line);color:var(--text-dim);padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer}.add-cat:hover{color:var(--text);border-color:var(--text-dim)}
.grid-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px 20px;overflow-x:auto}
.heatmap-scroll{display:flex;gap:10px}.daylabels{display:grid;grid-template-rows:14px repeat(7,13px);gap:3px;margin-top:0;font-size:10px;color:var(--text-dim);font-family:JetBrains Mono,monospace}.daylabels div{height:13px;line-height:13px}
.months-and-grid{flex:1}.monthlabels{display:grid;grid-auto-flow:column;font-size:11px;color:var(--text-dim);height:14px;margin-bottom:3px;font-family:JetBrains Mono,monospace}
.cells{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px}
.cell{width:13px;height:13px;border-radius:3px;background:var(--panel-2);cursor:pointer;transition:transform .1s;position:relative}.cell:hover{transform:scale(1.35);z-index:5}
.cell.today{box-shadow:0 0 0 1.8px #fff,0 0 10px rgba(255,255,255,.9),0 0 18px rgba(255,255,255,.35);z-index:4}
.cell.empty{visibility:hidden;cursor:default}.cell:hover::after{content:attr(data-tip);position:absolute;bottom:150%;left:50%;transform:translateX(-50%);background:#050608;color:var(--text);font-size:11px;font-family:JetBrains Mono,monospace;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:10;border:1px solid var(--line)}
.legend{display:flex;align-items:center;gap:6px;margin-top:16px;font-size:11px;color:var(--text-dim);justify-content:flex-end}.legend .cell{cursor:default;width:11px;height:11px}.legend .cell:hover{transform:none}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;width:100%;max-width:400px}.overlay{position:fixed;inset:0;background:rgba(6,7,10,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.overlay.show{display:flex}
.modal h3{font-family:Space Grotesk,sans-serif;font-size:18px;margin-bottom:2px}.modal .mdate{color:var(--text-dim);font-size:12px;margin-bottom:18px;font-family:JetBrains Mono,monospace}
.field{margin-bottom:14px}.field label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.field label .catname{display:flex;align-items:center;gap:7px;font-weight:500}.field label .dot{width:8px;height:8px;border-radius:50%}.field input[type=range]{width:100%;accent-color:var(--fld-color,var(--all))}.field .valtext{font-family:JetBrains Mono,monospace;color:var(--text-dim)}
.hour-input{width:90px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:5px 7px;font:12px JetBrains Mono,monospace;text-align:right}.hour-input:focus{outline:none;border-color:var(--all)}
.modal-actions{display:flex;gap:10px;margin-top:20px}.btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;font-size:13px;font-weight:500}.btn.primary{background:var(--all);color:#1a1000;border-color:var(--all);font-weight:600}.btn:hover{filter:brightness(1.1)}
.close-x{position:absolute;top:16px;right:16px;cursor:pointer;color:var(--text-dim);background:none;border:none;font-size:18px}
.newcat-row{display:flex;gap:8px;margin-bottom:14px}.newcat-row input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px}
.swatch-row{display:flex;gap:6px;margin-bottom:14px}.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}.swatch.sel{border-color:#fff}
.catlist{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:260px;overflow-y:auto}.catlist .row{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--panel-2);padding:7px 10px;border-radius:8px}
.catlist .row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}.catlist .row .catlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{cursor:pointer;color:var(--text-dim);background:none;border:none;padding:4px;line-height:1;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}.icon-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}.rm:hover{color:var(--workout)}
.ms-list-card .ms-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.ms-list-card .ms-row:last-child{border-bottom:none}.ms-date{font-family:JetBrains Mono,monospace;color:var(--text-dim);min-width:78px}.ms-label{flex:1}.ms-rm{cursor:pointer;color:var(--text-dim);background:none;border:none;font-size:14px}.ms-rm:hover{color:var(--workout)}.ms-list-card h4{font-family:Space Grotesk,sans-serif;font-size:15px;margin-bottom:10px;font-weight:600}.ms-empty{color:var(--text-dim);font-size:13px}
.countdown{font-family:JetBrains Mono,monospace;font-size:11px;color:var(--all);white-space:nowrap}
.archived-note{color:var(--text-dim);font-size:12px;margin:8px 0 12px}
#authGate{position:fixed;inset:0;background:radial-gradient(ellipse at top,#161923 0%,var(--bg) 55%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}#authGate.hidden{display:none}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}.auth-card h2{font-family:Space Grotesk,sans-serif;font-size:24px;margin-bottom:5px}.auth-card p{color:var(--text-dim);font-size:13px;line-height:1.5;margin-bottom:18px}.auth-input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px 11px;font-size:13px;margin-bottom:10px;outline:none}.auth-input:focus{border-color:var(--all)}.auth-error{color:var(--workout);font-size:12px;min-height:18px;margin:5px 0 10px}.auth-toggle{margin-top:12px;text-align:center;color:var(--text-dim);font-size:12px;cursor:pointer}.auth-toggle:hover{color:var(--text)}
#userBar{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:11px;font-family:JetBrains Mono,monospace}#userBar button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:11px}
@media(max-width:560px){.title{font-size:24px}.stat .num{font-size:20px}}
</style>
</head>
<body>

<div id="authGate"><div class="auth-card">
<h2>Prod <span style="color:var(--all)">Grid</span></h2>
<p id="authSubtitle">Sign in to keep your productivity data synced across your devices.</p>
<input class="auth-input" id="authEmail" type="email" autocomplete="email" placeholder="Email">
<input class="auth-input" id="authPassword" type="password" autocomplete="current-password" placeholder="Password">
<div class="auth-error" id="authError"></div>
<button class="btn primary" id="authSubmit" style="width:100%">Sign in</button>
<div class="auth-toggle" id="authToggle">Need an account? Create one</div>
</div></div>

<div class="wrap">
<header>
<div><div class="title">Prod <span>Grid</span></div><div class="subtitle">A GitHub-style contribution map, for your actual output.</div></div>
<div class="year-nav"><button id="prevYear">&#8592;</button><div class="year-num" id="yearNum"></div><button id="nextYear">&#8594;</button></div>
<div id="userBar"><span id="userEmail"></span><button id="logoutBtn">Sign out</button></div>
</header>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div class="grid-card"><div class="heatmap-scroll"><div class="daylabels" id="dayLabels"></div><div class="months-and-grid"><div class="monthlabels" id="monthLabels"></div><div class="cells" id="cells"></div></div></div><div class="legend" id="legend"></div></div>
<div class="grid-card ms-list-card" style="margin-top:16px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;"><h4 style="margin-bottom:0">Important dates</h4><div class="add-cat" id="addMilestoneBtn">+ Add date</div></div><div id="msListContent"></div></div>
</div>

<div class="overlay" id="dayOverlay"><div class="modal" id="dayModal"></div></div>
<div class="overlay" id="catOverlay"><div class="modal" id="catModal"></div></div>
<div class="overlay" id="catEditOverlay"><div class="modal" id="catEditModal"></div></div>
<div class="overlay" id="milestoneOverlay"><div class="modal" id="milestoneModal"></div></div>

<script>
const DEFAULT_CATS=[
{id:'work',name:'Work',color:'var(--work)',max:6,archived:false},
{id:'workout',name:'Workouts',color:'var(--workout)',max:2,archived:false},
{id:'school',name:'School',color:'var(--school)',max:5,archived:false},
{id:'projects',name:'Projects',color:'var(--projects)',max:4,archived:false}
];
const SWATCHES=['#5b8cff','#ff5c7a','#b47cff','#3ddc97','#ffcc66','#ff9f43','#5be0d0','#e08cff','#8cd6ff','#ffab5b'];
let config={categories:DEFAULT_CATS,goalHours:13};
let entries={},milestones={},currentYear=new Date().getFullYear(),activeTab='all',selectedDate=null;
const resolveColor=c=>c.startsWith('var(')?getComputedStyle(document.documentElement).getPropertyValue(c.slice(4,-1)).trim():c;
const activeCategories=()=>config.categories.filter(c=>!c.archived);
const allCategories=()=>config.categories;

async function loadData(){
try{const cloud=window.firebaseLoadData?await window.firebaseLoadData():null;if(cloud){if(cloud.config)config=cloud.config;if(cloud.entries)entries=cloud.entries;if(cloud.milestones)milestones=cloud.milestones;normalizeConfig();render();return}}catch(e){console.error(e)}
try{const r=await window.storage.get('config',false);if(r?.value)config=JSON.parse(r.value)}catch(e){}
try{const r=await window.storage.get('entries',false);if(r?.value)entries=JSON.parse(r.value)}catch(e){}
try{const r=await window.storage.get('milestones',false);if(r?.value)milestones=JSON.parse(r.value)}catch(e){}
normalizeConfig();render();
}
function normalizeConfig(){
config.categories=(config.categories||[]).map(c=>({...c,archived:!!c.archived,max:c.max||4}));
config.goalHours=config.goalHours||13;
}
let toastTimer=null;
function showToast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#050608;border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.4)';document.body.appendChild(el)}el.textContent=msg;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,3500)}
async function saveWithRetry(key,value){
let localOk=false;try{await window.storage.set(key,value,false);localOk=true}catch(e){try{await new Promise(r=>setTimeout(r,600));await window.storage.set(key,value,false);localOk=true}catch(e2){}}
try{if(window.firebaseSaveData)await window.firebaseSaveData({config,entries,milestones});return true}catch(e){showToast("Couldn't sync to Firebase — your local copy was kept");return localOk}
}
const saveConfig=()=>saveWithRetry('config',JSON.stringify(config));
const saveEntries=()=>saveWithRetry('entries',JSON.stringify(entries));
const saveMilestones=()=>saveWithRetry('milestones',JSON.stringify(milestones));
function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function productivityScore(key){const e=entries[key];if(!e)return 0;let total=0;config.categories.forEach(c=>total+=(Number(e[c.id])||0));return Math.max(0,Math.min(100,Math.round(total/config.goalHours*100)))}
function levelFor(tab,key){
const e=entries[key];if(!e)return 0;
if(tab==='all'){const s=productivityScore(key);if(!s)return 0;return s<25?1:s<50?2:s<75?3:4}
if(tab==='sleep'){const s=Number(e.sleep)||0;if(!s)return 0;return s<25?1:s<50?2:s<75?3:4}
const cat=config.categories.find(c=>c.id===tab);if(!cat)return 0;const v=Number(e[tab])||0;if(!v)return 0;const max=cat.max||4;return v<max*.25?1:v<max*.5?2:v<max*.75?3:4
}
function colorFor(tab){if(tab==='all')return resolveColor('var(--all)');if(tab==='sleep')return resolveColor('var(--sleep)');const c=config.categories.find(x=>x.id===tab);return c?resolveColor(c.color):resolveColor('var(--all)')}
function hexToRgba(hex,a){const h=hex.replace('#','');return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`}
const EDIT_ICON='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';

function renderTabs(){
const tabs=document.getElementById('tabs');tabs.innerHTML='';
const items=[{id:'all',name:'All',color:resolveColor('var(--all)')},...activeCategories().map(c=>({id:c.id,name:c.name,color:resolveColor(c.color)})),{id:'sleep',name:'Sleep',color:resolveColor('var(--sleep)')}];
items.forEach(it=>{const t=document.createElement('div');t.className='tab'+(activeTab===it.id?' active':'');t.style.setProperty('--tab-color',it.color);const cat=config.categories.find(c=>c.id===it.id);t.innerHTML=`<span class="dot" style="background:${it.color}"></span>${it.name}${cat?`<button class="tab-edit" title="Edit category" onclick="event.stopPropagation();openCatEditDirect('${cat.id}')">${EDIT_ICON}</button>`:''}`;t.onclick=()=>{activeTab=it.id;render()};tabs.appendChild(t)});
const add=document.createElement('div');add.className='add-cat';add.textContent='+ Category';add.onclick=openCatModal;tabs.appendChild(add);
}
function renderStats(){
const todayKey=dateKey(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()),todayScore=productivityScore(todayKey);let streak=0,d=new Date();
while(productivityScore(dateKey(d.getFullYear(),d.getMonth(),d.getDate()))>0){streak++;d.setDate(d.getDate()-1)}
let yearTotalHours=0,sleepSum=0,sleepCount=0;Object.keys(entries).forEach(k=>{if(k.startsWith(String(currentYear))){config.categories.forEach(c=>yearTotalHours+=Number(entries[k][c.id])||0);if(entries[k].sleep){sleepSum+=Number(entries[k].sleep);sleepCount++}}});
document.getElementById('stats').innerHTML=[{num:todayScore+'%',lbl:"Today's score"},{num:streak,lbl:'Day streak'},{num:Math.round(yearTotalHours)+'h',lbl:currentYear+' total hours'},{num:sleepCount?Math.round(sleepSum/sleepCount):'—',lbl:currentYear+' avg sleep'}].map(c=>`<div class="stat"><div class="num">${c.num}</div><div class="lbl">${c.lbl}</div></div>`).join('');
}
function renderGrid(){
document.getElementById('dayLabels').innerHTML='<div></div>'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>i%2?`<div>${d}</div>`:'<div></div>').join('');
const start=new Date(currentYear,0,1),end=new Date(currentYear,11,31),pad=start.getDay(),days=Math.round((end-start)/86400000)+1,weeks=Math.ceil((pad+days)/7),cells=document.getElementById('cells');cells.style.gridTemplateColumns=`repeat(${weeks},13px)`;cells.innerHTML='';
const color=colorFor(activeTab),todayStr=dateKey(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()),monthStarts=[];
for(let i=0;i<weeks*7;i++){const cell=document.createElement('div');if(i<pad||i>=pad+days){cell.className='cell empty';cells.appendChild(cell);continue}const dt=new Date(currentYear,0,1+i-pad),key=dateKey(dt.getFullYear(),dt.getMonth(),dt.getDate());if(dt.getDate()===1)monthStarts.push({month:dt.getMonth(),col:Math.floor(i/7)});const lvl=levelFor(activeTab,key);cell.className='cell'+(key===todayStr?' today':'');cell.style.background=lvl?'': 'var(--panel-2)';if(lvl)cell.style.background=hexToRgba(color,.18+lvl*.2);const e=entries[key];let tip=dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});if(e){if(activeTab==='all')tip+=` · ${productivityScore(key)}%`;else if(activeTab==='sleep')tip+=e.sleep?` · sleep ${e.sleep}`:' · no data';else tip+=e[activeTab]?` · ${e[activeTab]}h`:' · 0h'}if(milestones[key]){tip+=` ★ ${milestones[key]}`;cell.style.outline=`1.5px solid ${resolveColor('var(--all)')}`;cell.style.outlineOffset='1px'}cell.dataset.tip=tip;cell.onclick=()=>openDayModal(key,dt);cells.appendChild(cell)}
const labels=document.getElementById('monthLabels');labels.style.gridTemplateColumns=`repeat(${weeks},13px)`;const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],slots=new Array(weeks).fill('');monthStarts.forEach(m=>slots[m.col]=names[m.month]);labels.innerHTML=slots.map(s=>`<div>${s}</div>`).join('');
const legend=document.getElementById('legend');let h='Less ';for(let l=0;l<=4;l++)h+=`<div class="cell" style="background:${l?'': 'var(--panel-2)'}${l?` ;background:${hexToRgba(color,.18+l*.2)}`:''}"></div>`;legend.innerHTML=h+' More';
}
function render(){document.getElementById('yearNum').textContent=currentYear;renderTabs();renderStats();renderGrid();renderMilestoneList()}
prevYear.onclick=()=>{currentYear--;render()};nextYear.onclick=()=>{currentYear++;render()};

let entryDraft={};
function openDayModal(key,dt){
selectedDate=key;const e=entries[key]||{},modal=document.getElementById('dayModal'),dateStr=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
entryDraft={...e};
let fields=activeCategories().map(c=>{const val=Number(e[c.id])||0,col=resolveColor(c.color);return `<div class="field"><label><span class="catname"><span class="dot" style="background:${col}"></span>${c.name}</span><span class="valtext"><input class="hour-input" type="number" min="0" max="24" step="0.25" value="${val}" oninput="entryDraft['${c.id}']=Math.max(0,parseFloat(this.value)||0)"></span></label></div>`}).join('');
fields+=`<div class="field"><label><span class="catname"><span class="dot" style="background:${resolveColor('var(--sleep)')}"></span>Sleep score</span><span class="valtext"><input class="hour-input" type="number" min="0" max="100" step="1" value="${Number(e.sleep)||0}" oninput="entryDraft.sleep=Math.max(0,Math.min(100,parseFloat(this.value)||0))"></span></label></div>`;
modal.innerHTML=`<button class="close-x" onclick="closeDayModal()">✕</button><h3>Log this day</h3><div class="mdate">${dateStr}</div>${fields}<div class="modal-actions"><button class="btn" onclick="closeDayModal()">Cancel</button><button class="btn primary" onclick="saveDay()">Save</button></div>`;
document.getElementById('dayOverlay').classList.add('show');
}
function closeDayModal(){dayOverlay.classList.remove('show')}
async function saveDay(){entries[selectedDate]={...entries[selectedDate],...entryDraft};await saveEntries();closeDayModal();render()}

let newCatColor=SWATCHES[0];
function openCatModal(){renderCatModal();catOverlay.classList.add('show')}function closeCatModal(){catOverlay.classList.remove('show')}
function renderCatModal(){
const list=allCategories().map(c=>{const col=resolveColor(c.color);return `<div class="row"><span class="dot" style="background:${col}"></span><span class="catlabel">${c.name}${c.archived?' <span style="color:var(--text-dim)">(archived)</span>':''}</span><button class="icon-btn" onclick="openCatEditDirect('${c.id}')">${EDIT_ICON}</button><button class="icon-btn rm" onclick="toggleArchive('${c.id}')">${c.archived?'↩':'▣'}</button></div>`}).join('');
catModal.innerHTML=`<button class="close-x" onclick="closeCatModal()">✕</button><h3>Categories</h3><div class="mdate">Archive old categories to clean up the tabs. Historical entries remain intact.</div><div class="catlist">${list||'No categories yet.'}</div><div class="newcat-row"><input id="newCatName" placeholder="e.g. Reading" maxlength="20"></div><div class="swatch-row">${SWATCHES.map(s=>`<div class="swatch ${s===newCatColor?'sel':''}" style="background:${s}" onclick="pickSwatch('${s}')"></div>`).join('')}</div><div class="field"><label>Daily hour cap for full color <span class="valtext" id="capVal">4h</span></label><input id="newCap" type="range" min="1" max="10" step=".5" value="4" oninput="capVal.textContent=this.value+'h'"></div><div class="modal-actions"><button class="btn" onclick="closeCatModal()">Close</button><button class="btn primary" onclick="addCat()">Add category</button></div>`;
}
function pickSwatch(s){newCatColor=s;renderCatModal()}
async function toggleArchive(id){const c=config.categories.find(x=>x.id===id);if(!c)return;c.archived=!c.archived;if(activeTab===id&&c.archived)activeTab='all';await saveConfig();render();renderCatModal()}
async function addCat(){const name=document.getElementById('newCatName').value.trim();if(!name)return;const cap=parseFloat(document.getElementById('newCap').value);const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36).slice(-4);config.categories.push({id,name,color:newCatColor,max:cap,archived:false});await saveConfig();render();renderCatModal()}

let editingCatId=null,editDraftColor=null,editDraftMax=4;
function openCatEditDirect(id){const c=config.categories.find(x=>x.id===id);if(!c)return;editingCatId=id;editDraftColor=resolveColor(c.color);editDraftMax=c.max||4;renderCatEditor();catEditOverlay.classList.add('show')}
function closeCatEditor(){catEditOverlay.classList.remove('show');editingCatId=null}
function renderCatEditor(){const c=config.categories.find(x=>x.id===editingCatId);if(!c)return;catEditModal.innerHTML=`<button class="close-x" onclick="closeCatEditor()">✕</button><h3>Edit category</h3><div class="mdate">${c.name}</div><div class="field"><label>Name</label><input type="text" id="editCatName" value="${c.name.replace(/"/g,'&quot;')}" style="width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px"></div><div class="field"><label>Color</label><input type="color" id="editCatColor" value="${editDraftColor}" oninput="editDraftColor=this.value"></div><div class="field"><label>Daily hour cap <span class="valtext" id="editCapVal">${editDraftMax}h</span></label><input type="range" min="1" max="10" step=".5" value="${editDraftMax}" oninput="editDraftMax=parseFloat(this.value);editCapVal.textContent=this.value+'h'"></div><div class="modal-actions"><button class="btn" onclick="toggleArchive('${c.id}');closeCatEditor()">${c.archived?'Unarchive':'Archive'}</button><button class="btn" onclick="closeCatEditor()">Cancel</button><button class="btn primary" onclick="saveEditCat('${c.id}')">Save</button></div>`}
async function saveEditCat(id){const c=config.categories.find(x=>x.id===id);const n=document.getElementById('editCatName').value.trim();if(n)c.name=n;c.color=editDraftColor;c.max=editDraftMax;await saveConfig();closeCatEditor();render()}

addMilestoneBtn.onclick=openMilestoneModal;
function openMilestoneModal(){renderMilestoneModal();milestoneOverlay.classList.add('show')}function closeMilestoneModal(){milestoneOverlay.classList.remove('show')}
function countdownText(k){const diff=Math.round((new Date(k+'T00:00:00')-new Date(new Date().toDateString()))/86400000);if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff>1)return`in ${diff} days`;if(diff===-1)return'Yesterday';return`${Math.abs(diff)} days ago`}
function renderMilestoneList(){const el=msListContent,sorted=Object.keys(milestones).sort();if(!sorted.length){el.innerHTML='<div class="ms-empty">No important dates yet — add one with the button above.</div>';return}el.innerHTML=sorted.map(k=>{const nice=new Date(k+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});return `<div class="ms-row"><span class="ms-date">${nice}</span><span class="ms-label">${milestones[k]}</span><span class="countdown">${countdownText(k)}</span><button class="icon-btn" onclick="startEditMs('${k}')">${EDIT_ICON}</button><button class="ms-rm" onclick="removeMilestone('${k}')">✕</button></div>`}).join('')}
function renderMilestoneModal(){milestoneModal.innerHTML=`<button class="close-x" onclick="closeMilestoneModal()">✕</button><h3>Important dates</h3><div class="mdate">Deadlines, exams, launches — anything worth flagging.</div><div class="field"><label>Date</label><input type="date" id="msDate" style="width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px"></div><div class="newcat-row"><input id="msLabel" placeholder="e.g. Final exam" maxlength="40"></div><div class="modal-actions"><button class="btn" onclick="closeMilestoneModal()">Close</button><button class="btn primary" onclick="addMilestone()">Add date</button></div>`}
async function addMilestone(){const k=msDate.value,l=msLabel.value.trim();if(!k||!l)return;milestones[k]=l;await saveMilestones();render();renderMilestoneModal()}
async function removeMilestone(k){delete milestones[k];await saveMilestones();render();renderMilestoneModal()}
function startEditMs(k){const newLabel=prompt('Edit important date label:',milestones[k]);if(newLabel?.trim()){milestones[k]=newLabel.trim();saveMilestones().then(render)}}

loadData();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import{getDatabase,ref,get,set,onValue}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCBid_noERoZNKFl2qjmLmi_iTT2CQRKzk",authDomain:"prodgrid.firebaseapp.com",projectId:"prodgrid",storageBucket:"prodgrid.firebasestorage.app",messagingSenderId:"426955805367",appId:"1:426955805367:web:d398168e6cfe36fd703332",measurementId:"G-PVZX5XV4FC",databaseURL:"https://prodgrid-default-rtdb.firebaseio.com/"};
const app=initializeApp(firebaseConfig),auth=getAuth(app);let db=null,activeUser=null,cloudListenerStarted=false;
const gate=document.getElementById('authGate'),emailInput=document.getElementById('authEmail'),passwordInput=document.getElementById('authPassword'),authSubmit=document.getElementById('authSubmit'),authToggle=document.getElementById('authToggle'),authError=document.getElementById('authError'),authSubtitle=document.getElementById('authSubtitle'),userEmail=document.getElementById('userEmail'),logoutBtn=document.getElementById('logoutBtn');let createMode=false;
function showAuthError(e){const m={'auth/invalid-credential':'Incorrect email or password.','auth/email-already-in-use':'That email already has an account.','auth/invalid-email':'Enter a valid email address.','auth/weak-password':'Password must be at least 6 characters.','auth/too-many-requests':'Too many attempts. Try again later.','auth/configuration-not-found':'Email/password sign-in is not enabled in Firebase Authentication.'};authError.textContent=m[e.code]||e.message||'Authentication failed.'}
authToggle.onclick=()=>{createMode=!createMode;authSubmit.textContent=createMode?'Create account':'Sign in';authToggle.textContent=createMode?'Already have an account? Sign in':'Need an account? Create one';authSubtitle.textContent=createMode?'Create your personal account. Your data will be stored under your account.':'Sign in to keep your productivity data synced across your devices.';authError.textContent=''};
authSubmit.onclick=async()=>{const email=emailInput.value.trim(),password=passwordInput.value;authError.textContent='';if(!email||!password){authError.textContent='Enter your email and password.';return}authSubmit.disabled=true;try{if(createMode)await createUserWithEmailAndPassword(auth,email,password);else await signInWithEmailAndPassword(auth,email,password)}catch(e){showAuthError(e)}finally{authSubmit.disabled=false}};
passwordInput.addEventListener('keydown',e=>{if(e.key==='Enter')authSubmit.click()});logoutBtn.onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{activeUser=user;if(!user){gate.classList.remove('hidden');userEmail.textContent='';return}gate.classList.add('hidden');userEmail.textContent=user.email||'Signed in';db=getDatabase(app);await loadCloudIntoApp();startRealtimeListener()});
async function loadCloudIntoApp(){if(!activeUser||!db)return null;const s=await get(ref(db,`users/${activeUser.uid}/dashboard`)),data=s.val();if(data){if(data.config)config=data.config;if(data.entries)entries=data.entries;if(data.milestones)milestones=data.milestones;normalizeConfig();render()}return data}
function startRealtimeListener(){if(cloudListenerStarted||!activeUser||!db)return;cloudListenerStarted=true;onValue(ref(db,`users/${activeUser.uid}/dashboard`),s=>{const d=s.val();if(!d)return;if(d.config)config=d.config;if(d.entries)entries=d.entries;if(d.milestones)milestones=d.milestones;normalizeConfig();render()})}
window.firebaseLoadData=async()=>activeUser&&db?loadCloudIntoApp():null;
window.firebaseSaveData=async data=>{if(!activeUser||!db)return false;await set(ref(db,`users/${activeUser.uid}/dashboard`),{...data,lastSavedTimestamp:new Date().toISOString()});return true};
</script>
