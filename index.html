<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prod Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101219;
    --panel:#181b24;
    --panel-2:#1e222d;
    --line:rgba(255,255,255,0.07);
    --text:#e8e9ee;
    --text-dim:#8b8f9e;
    --work:#5b8cff;
    --workout:#ff5c7a;
    --school:#b47cff;
    --projects:#3ddc97;
    --sleep:#ffcc66;
    --all:#ff9f43;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(ellipse at top, #161923 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 24px 60px;
  }
  .wrap{max-width:1040px; margin:0 auto;}

  header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:16px;}
  .title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; letter-spacing:-0.02em;}
  .title span{color:var(--all);}
  .subtitle{color:var(--text-dim); font-size:13px; margin-top:4px;}

  .year-nav{display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono',monospace;}
  .year-nav button{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:14px;
  }
  .year-nav button:hover{border-color:var(--all); color:var(--all);}
  .year-num{font-size:16px; font-weight:600; min-width:48px; text-align:center;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:24px;}
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  }
  .stat .num{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:600;}
  .stat .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}

  .tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
  .tab{
    background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    padding:7px 10px 7px 14px; border-radius:999px; font-size:13px; cursor:grab; font-weight:500;
    display:flex; align-items:center; gap:7px;
    transition:background .15s, border-color .15s, color .15s, box-shadow .15s, transform .12s, opacity .12s;
  }
  .tab.dragging{opacity:0.35; transform:scale(0.96);}
  .tab .dot{width:8px; height:8px; border-radius:50%;}
  .tab.active{color:var(--text); border-color:var(--tab-color, var(--all)); background:var(--panel-2); box-shadow:0 0 0 1px var(--tab-color, var(--all)) inset;}
  .tab:hover{color:var(--text);}
  .tab-edit{
    display:flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; border:none; cursor:pointer;
    background:transparent; color:var(--text-dim); padding:0; margin-left:2px;
    transition:background .15s, color .15s;
  }
  .tab-edit:hover{background:rgba(255,255,255,0.1); color:var(--text);}

  .add-cat{background:transparent; border:1px dashed var(--line); color:var(--text-dim); padding:7px 12px; border-radius:999px; font-size:13px; cursor:pointer;}
  .add-cat:hover{color:var(--text); border-color:var(--text-dim);}

  .grid-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 24px 20px; overflow-x:auto;}
  .heatmap-scroll{display:flex; gap:10px;}
  .daylabels{display:grid; grid-template-rows:14px repeat(7, 13px); gap:3px; margin-top:0; font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .daylabels div{height:13px; line-height:13px;}

  .months-and-grid{flex:1;}
  .monthlabels{display:grid; grid-auto-flow:column; font-size:11px; color:var(--text-dim); height:14px; margin-bottom:3px; font-family:'JetBrains Mono',monospace;}
  .cells{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 13px); gap:3px;}
  .cell{
    width:13px; height:13px; border-radius:3px; background:var(--panel-2);
    cursor:pointer; transition:transform .1s;
    position:relative;
  }
  .cell:hover{transform:scale(1.35); z-index:5;}
  .cell.today{box-shadow:0 0 0 1.5px var(--text);}
  .cell.empty{visibility:hidden; cursor:default;}
  .cell:hover::after{
    content:attr(data-tip);
    position:absolute; bottom:150%; left:50%; transform:translateX(-50%);
    background:#050608; color:var(--text); font-size:11px; font-family:'JetBrains Mono',monospace;
    padding:5px 8px; border-radius:6px; white-space:nowrap; pointer-events:none; z-index:10;
    border:1px solid var(--line);
  }

  .legend{display:flex; align-items:center; gap:6px; margin-top:16px; font-size:11px; color:var(--text-dim); justify-content:flex-end;}
  .legend .cell{cursor:default; width:11px; height:11px;}
  .legend .cell:hover{transform:none;}

  .footer-note{color:var(--text-dim); font-size:12px; margin-top:22px; line-height:1.6;}
  .footer-note a{color:var(--all); text-decoration:none;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(6,7,10,0.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px;
    width:100%; max-width:380px;
  }
  .modal h3{font-family:'Space Grotesk',sans-serif; font-size:18px; margin-bottom:2px;}
  .modal .mdate{color:var(--text-dim); font-size:12px; margin-bottom:18px; font-family:'JetBrains Mono',monospace;}
  .field{margin-bottom:14px;}
  .field label{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .field label .catname{display:flex; align-items:center; gap:7px; font-weight:500;}
  .field label .dot{width:8px; height:8px; border-radius:50%;}
  .field input[type=range]{width:100%; accent-color:var(--fld-color, var(--all));}
  .field .valtext{font-family:'JetBrains Mono',monospace; color:var(--text-dim);}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .btn{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer; font-size:13px; font-weight:500;}
  .btn.primary{background:var(--all); color:#1a1000; border-color:var(--all); font-weight:600;}
  .btn:hover{filter:brightness(1.1);}
  .close-x{position:absolute; top:16px; right:16px; cursor:pointer; color:var(--text-dim); background:none; border:none; font-size:18px;}
  .modal{position:relative;}

  .newcat-row{display:flex; gap:8px; margin-bottom:14px;}
  .newcat-row input{flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px;}
  .swatch-row{display:flex; gap:6px; margin-bottom:14px;}
  .swatch{width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.sel{border-color:#fff;}
  .catlist{display:flex; flex-direction:column; gap:8px; margin-bottom:16px; max-height:260px; overflow-y:auto;}
  .catlist .row{display:flex; align-items:center; gap:8px; font-size:13px; background:var(--panel-2); padding:7px 10px; border-radius:8px; cursor:grab; transition:opacity .12s, transform .12s;}
  .catlist .row.dragging{opacity:0.35; transform:scale(0.97);}
  .catlist .row .dot{width:9px;height:9px;border-radius:50%; flex-shrink:0;}
  .catlist .row .catlabel{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .catlist .row .icon-btn{cursor:pointer; color:var(--text-dim); background:none; border:none; font-size:13px; padding:4px; line-height:1; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; transition:background .15s, color .15s;}
  .catlist .row .icon-btn:hover{background:rgba(255,255,255,0.08);}
  .catlist .row .icon-btn:hover{color:var(--text);}
  .catlist .row .rm:hover{color:var(--workout);}
  .edit-row{display:flex; flex-direction:column; gap:8px; background:var(--panel-2); padding:10px; border-radius:8px;}
  .edit-row input[type=text]{background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:7px 9px; font-size:13px;}
  .edit-actions{display:flex; gap:8px;}
  .edit-actions button{flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; font-size:12px; font-weight:500; transition:background .15s, border-color .15s;}
  .edit-actions button:hover{background:var(--panel-2);}
  .edit-actions button.save{background:var(--all); color:#1a1000; border-color:var(--all); font-weight:600;}
  .edit-actions button.save:hover{filter:brightness(1.08);}

  .ms-list-card .ms-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .ms-list-card .ms-row:last-child{border-bottom:none;}
  .ms-list-card .ms-date{font-family:'JetBrains Mono',monospace; color:var(--text-dim); min-width:78px;}
  .ms-list-card .ms-label{flex:1;}
  .ms-list-card .ms-rm{cursor:pointer; color:var(--text-dim); background:none; border:none; font-size:14px;}
  .ms-list-card .ms-rm:hover{color:var(--workout);}
  .ms-list-card .icon-btn{cursor:pointer; color:var(--text-dim); background:none; border:none; padding:4px; line-height:1; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; transition:background .15s, color .15s;}
  .ms-list-card .icon-btn:hover{background:rgba(255,255,255,0.08); color:var(--text);}
  .ms-list-card h4{font-family:'Space Grotesk',sans-serif; font-size:15px; margin-bottom:10px; font-weight:600;}
  .ms-empty{color:var(--text-dim); font-size:13px;}

  @media (max-width:560px){
    .title{font-size:24px;}
    .stat .num{font-size:20px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title">Prod <span>Grid</span></div>
      <div class="subtitle">A GitHub-style contribution map, for your actual output.</div>
    </div>
    <div class="year-nav">
      <button id="prevYear">&#8592;</button>
      <div class="year-num" id="yearNum">2026</div>
      <button id="nextYear">&#8594;</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs"></div>

  <div class="grid-card">
    <div class="heatmap-scroll">
      <div class="daylabels" id="dayLabels"></div>
      <div class="months-and-grid">
        <div class="monthlabels" id="monthLabels"></div>
        <div class="cells" id="cells"></div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="grid-card ms-list-card" style="margin-top:16px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
      <h4 style="margin-bottom:0;">Important dates</h4>
      <div class="add-cat" id="addMilestoneBtn">+ Add date</div>
    </div>
    <div id="msListContent"></div>
  </div>
</div>

<div class="overlay" id="dayOverlay">
  <div class="modal" id="dayModal"></div>
</div>

<div class="overlay" id="catOverlay">
  <div class="modal" id="catModal"></div>
</div>

<div class="overlay" id="catEditOverlay">
  <div class="modal" id="catEditModal"></div>
</div>

<div class="overlay" id="milestoneOverlay">
  <div class="modal" id="milestoneModal"></div>
</div>

<script>
const DEFAULT_CATS = [
  {id:'work', name:'Work', color:'var(--work)', max:6},
  {id:'workout', name:'Workouts', color:'var(--workout)', max:2},
  {id:'school', name:'School', color:'var(--school)', max:5},
  {id:'projects', name:'Projects', color:'var(--projects)', max:4},
];
const SWATCHES = ['#5b8cff','#ff5c7a','#b47cff','#3ddc97','#ffcc66','#ff9f43','#5be0d0','#e08cff','#8cd6ff','#ffab5b'];

let config = { categories: DEFAULT_CATS, goalHours: 13 };
let entries = {};
let milestones = {};
let currentYear = new Date().getFullYear();
let activeTab = 'all';
let selectedDate = null;

const resolveColor = c => {
  if(c.startsWith('var(')){
    return getComputedStyle(document.documentElement).getPropertyValue(c.slice(4,-1)).trim();
  }
  return c;
};

async function loadData(){
  try{
    const cfgRes = await window.storage.get('config', false);
    if(cfgRes && cfgRes.value) config = JSON.parse(cfgRes.value);
  }catch(e){ /* no config yet, use default */ }
  try{
    const entRes = await window.storage.get('entries', false);
    if(entRes && entRes.value) entries = JSON.parse(entRes.value);
  }catch(e){ /* no entries yet */ }
  try{
    const msRes = await window.storage.get('milestones', false);
    if(msRes && msRes.value) milestones = JSON.parse(msRes.value);
  }catch(e){ /* no milestones yet */ }
  render();
}

let toastTimer = null;
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#050608; border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:10px; font-size:13px; z-index:100; box-shadow:0 6px 24px rgba(0,0,0,0.4); transition:opacity .2s;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity = '0'; }, 3500);
}

async function saveWithRetry(key, value){
  try{
    const r = await window.storage.set(key, value, false);
    if(!r) throw new Error('empty response');
    return true;
  }catch(e){
    try{
      await new Promise(res=>setTimeout(res,600));
      const r2 = await window.storage.set(key, value, false);
      if(!r2) throw new Error('empty response on retry');
      return true;
    }catch(e2){
      console.error(`save ${key} failed`, e2);
      showToast("Couldn't save — check your connection and try again");
      return false;
    }
  }
}

async function saveConfig(){ return saveWithRetry('config', JSON.stringify(config)); }
async function saveEntries(){ return saveWithRetry('entries', JSON.stringify(entries)); }
async function saveMilestones(){ return saveWithRetry('milestones', JSON.stringify(milestones)); }

function dateKey(y,m,d){
  const mm=String(m+1).padStart(2,'0'), dd=String(d).padStart(2,'0');
  return `${y}-${mm}-${dd}`;
}

function productivityScore(key){
  const e = entries[key];
  if(!e) return 0;
  let total = 0;
  config.categories.forEach(c => { total += (e[c.id]||0); });
  return Math.max(0, Math.min(100, Math.round((total / config.goalHours) * 100)));
}

function levelFor(tab, key){
  const e = entries[key];
  if(!e) return 0;
  if(tab === 'all'){
    const s = productivityScore(key);
    if(s<=0) return 0;
    if(s<25) return 1; if(s<50) return 2; if(s<75) return 3; return 4;
  }
  if(tab === 'sleep'){
    const s = e.sleep || 0;
    if(s<=0) return 0;
    if(s<25) return 1; if(s<50) return 2; if(s<75) return 3; return 4;
  }
  const cat = config.categories.find(c=>c.id===tab);
  if(!cat) return 0;
  const v = e[tab] || 0;
  if(v<=0) return 0;
  const max = cat.max || 4;
  if(v<max*0.25) return 1; if(v<max*0.5) return 2; if(v<max*0.75) return 3; return 4;
}

function colorFor(tab){
  if(tab==='all') return resolveColor('var(--all)');
  if(tab==='sleep') return resolveColor('var(--sleep)');
  const cat = config.categories.find(c=>c.id===tab);
  return cat ? resolveColor(cat.color) : resolveColor('var(--all)');
}

function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

const EDIT_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>';

let tabDragId = null;
function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  const catIds = new Set(config.categories.map(c=>c.id));
  const items = [
    {id:'all', name:'All', color:resolveColor('var(--all)')},
    ...config.categories.map(c=>({id:c.id, name:c.name, color:resolveColor(c.color)})),
    {id:'sleep', name:'Sleep', color:resolveColor('var(--sleep)')},
  ];
  items.forEach(it=>{
    const t = document.createElement('div');
    t.className = 'tab' + (activeTab===it.id ? ' active':'');
    t.style.setProperty('--tab-color', it.color);
    const isCat = catIds.has(it.id);
    t.innerHTML = `<span class="dot" style="background:${it.color}"></span>${it.name}${isCat ? `<button class="tab-edit" title="Edit category" onclick="event.stopPropagation(); openCatEditDirect('${it.id}')">${EDIT_ICON}</button>` : ''}`;
    t.onclick = ()=>{ activeTab = it.id; render(); };
    if(isCat){
      t.draggable = true;
      t.dataset.tabId = it.id;
      t.ondragstart = (ev)=>{ tabDragId = it.id; ev.dataTransfer.effectAllowed = 'move'; setTimeout(()=>t.classList.add('dragging'),0); };
      t.ondragover = (ev)=>{
        ev.preventDefault();
        if(!tabDragId || tabDragId === it.id) return;
        const arr = config.categories;
        const fromIdx = arr.findIndex(c=>c.id===tabDragId);
        const toIdx = arr.findIndex(c=>c.id===it.id);
        if(fromIdx<0 || toIdx<0 || fromIdx===toIdx) return;
        const [moved] = arr.splice(fromIdx,1);
        arr.splice(toIdx,0,moved);
        renderTabs();
      };
      t.ondragend = ()=>{ tabDragId = null; saveConfig(); };
    }
    tabs.appendChild(t);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'add-cat';
  addBtn.textContent = '+ Category';
  addBtn.onclick = openCatModal;
  tabs.appendChild(addBtn);
}

function renderStats(){
  const stats = document.getElementById('stats');
  const todayKey = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const todayScore = productivityScore(todayKey);

  // current streak (consecutive days with score > 0, walking backward from today)
  let streak = 0;
  let d = new Date();
  while(true){
    const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    if(productivityScore(k) > 0){ streak++; d.setDate(d.getDate()-1); } else break;
  }

  // this year totals
  let yearTotalHours = 0, sleepSum=0, sleepCount=0;
  Object.keys(entries).forEach(k=>{
    if(k.startsWith(String(currentYear))){
      config.categories.forEach(c=>{ yearTotalHours += (entries[k][c.id]||0); });
      if(entries[k].sleep){ sleepSum += entries[k].sleep; sleepCount++; }
    }
  });
  const avgSleep = sleepCount ? Math.round(sleepSum/sleepCount) : 0;

  const cards = [
    {num: todayScore+'%', lbl:"Today's score"},
    {num: streak, lbl: 'Day streak'},
    {num: Math.round(yearTotalHours)+'h', lbl: currentYear+' total hours'},
    {num: avgSleep ? avgSleep : '—', lbl: currentYear+' avg sleep'},
  ];
  stats.innerHTML = cards.map(c=>`<div class="stat"><div class="num">${c.num}</div><div class="lbl">${c.lbl}</div></div>`).join('');
}

function renderGrid(){
  const dayLabels = document.getElementById('dayLabels');
  dayLabels.innerHTML = '<div></div>' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=> (i%2===1? `<div>${d}</div>` : '<div></div>')).join('');

  const start = new Date(currentYear,0,1);
  const end = new Date(currentYear,11,31);
  const startPad = start.getDay(); // days before Jan1 to fill week
  const totalDays = Math.round((end-start)/86400000)+1;
  const totalCells = startPad + totalDays;
  const weeks = Math.ceil(totalCells/7);

  const cellsEl = document.getElementById('cells');
  cellsEl.style.gridTemplateColumns = `repeat(${weeks}, 13px)`;
  cellsEl.innerHTML = '';

  const color = colorFor(activeTab);
  const todayStr = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const monthStarts = [];

  for(let i=0;i<weeks*7;i++){
    const cell = document.createElement('div');
    if(i < startPad || i >= startPad+totalDays){
      cell.className = 'cell empty';
      cellsEl.appendChild(cell);
      continue;
    }
    const dayIndex = i - startPad;
    const dt = new Date(currentYear,0,1+dayIndex);
    const key = dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
    if(dt.getDate()===1) monthStarts.push({month:dt.getMonth(), col: Math.floor(i/7)});

    const lvl = levelFor(activeTab, key);
    cell.className = 'cell' + (key===todayStr ? ' today':'');
    cell.style.background = lvl===0 ? 'var(--panel-2)' : hexToRgba(color, 0.18 + lvl*0.2);
    if(lvl>0) cell.style.boxShadow = `0 0 6px ${hexToRgba(color, 0.15+lvl*0.12)}`;

    const e = entries[key];
    let tip = dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    if(e){
      if(activeTab==='all') tip += ` · ${productivityScore(key)}%`;
      else if(activeTab==='sleep') tip += e.sleep ? ` · sleep ${e.sleep}` : ' · no data';
      else tip += e[activeTab] ? ` · ${e[activeTab]}h` : ' · 0h';
    }
    if(milestones[key]){
      tip += ` ★ ${milestones[key]}`;
      cell.style.outline = `1.5px solid ${resolveColor('var(--all)')}`;
      cell.style.outlineOffset = '1px';
    }
    cell.dataset.tip = tip;
    cell.onclick = ()=> openDayModal(key, dt);
    cellsEl.appendChild(cell);
  }

  const monthLabels = document.getElementById('monthLabels');
  monthLabels.style.gridTemplateColumns = `repeat(${weeks}, 13px)`;
  monthLabels.innerHTML = '';
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const slots = new Array(weeks).fill('');
  monthStarts.forEach(m=>{ slots[m.col] = monthNames[m.month]; });
  monthLabels.innerHTML = slots.map(s=>`<div>${s}</div>`).join('');

  // legend
  const legend = document.getElementById('legend');
  let html = 'Less ';
  for(let l=0;l<=4;l++){
    const bg = l===0 ? 'var(--panel-2)' : hexToRgba(color, 0.18+l*0.2);
    html += `<div class="cell" style="background:${bg}"></div>`;
  }
  html += ' More';
  legend.innerHTML = html;
}

function render(){
  document.getElementById('yearNum').textContent = currentYear;
  renderTabs();
  renderStats();
  renderGrid();
  renderMilestoneList();
}

document.getElementById('prevYear').onclick = ()=>{ currentYear--; render(); };
document.getElementById('nextYear').onclick = ()=>{ currentYear++; render(); };

// ---- Day modal ----
function openDayModal(key, dt){
  selectedDate = key;
  const e = entries[key] || {};
  const modal = document.getElementById('dayModal');
  const dateStr = dt.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});

  let fields = config.categories.map(c=>{
    const val = e[c.id]||0;
    const col = resolveColor(c.color);
    return `
    <div class="field">
      <label><span class="catname"><span class="dot" style="background:${col}"></span>${c.name}</span><span class="valtext" id="val-${c.id}">${val}h</span></label>
      <input type="range" min="0" max="${Math.max(c.max*2,4)}" step="0.5" value="${val}" style="--fld-color:${col}" oninput="document.getElementById('val-${c.id}').textContent=this.value+'h'; entryDraft['${c.id}']=parseFloat(this.value);">
    </div>`;
  }).join('');

  const sleepVal = e.sleep || 0;
  fields += `
    <div class="field">
      <label><span class="catname"><span class="dot" style="background:${resolveColor('var(--sleep)')}"></span>Sleep score</span><span class="valtext" id="val-sleep">${sleepVal}</span></label>
      <input type="range" min="0" max="100" step="1" value="${sleepVal}" style="--fld-color:${resolveColor('var(--sleep)')}" oninput="document.getElementById('val-sleep').textContent=this.value; entryDraft['sleep']=parseFloat(this.value);">
    </div>`;

  modal.innerHTML = `
    <button class="close-x" onclick="closeDayModal()">✕</button>
    <h3>Log this day</h3>
    <div class="mdate">${dateStr}</div>
    ${fields}
    <div class="modal-actions">
      <button class="btn" onclick="closeDayModal()">Cancel</button>
      <button class="btn primary" onclick="saveDay()">Save</button>
    </div>`;

  window.entryDraft = Object.assign({}, e);
  document.getElementById('dayOverlay').classList.add('show');
}
function closeDayModal(){ document.getElementById('dayOverlay').classList.remove('show'); }
async function saveDay(){
  entries[selectedDate] = Object.assign({}, entries[selectedDate]||{}, window.entryDraft);
  await saveEntries();
  closeDayModal();
  render();
}

// ---- Category modal (list: add / reorder / delete) ----
let newCatColor = SWATCHES[0];
function openCatModal(){
  renderCatModal();
  document.getElementById('catOverlay').classList.add('show');
}
function closeCatModal(){ document.getElementById('catOverlay').classList.remove('show'); }

function renderCatModal(){
  const modal = document.getElementById('catModal');
  const cats = config.categories;
  const list = cats.map((c)=>{
    const col = resolveColor(c.color);
    return `<div class="row" draggable="true" data-cat-id="${c.id}"
        ondragstart="dragCatStart(event,'${c.id}')"
        ondragover="dragCatOver(event,'${c.id}')"
        ondragend="dragCatEnd(event)">
      <span class="dot" style="background:${col}"></span>
      <span class="catlabel">${c.name}</span>
      <button class="icon-btn" title="Edit" onclick="openCatEditDirect('${c.id}')">${EDIT_ICON}</button>
      <button class="icon-btn rm" title="Delete" onclick="removeCat('${c.id}')">✕</button>
    </div>`;
  }).join('') || '<div style="color:var(--text-dim); font-size:13px;">No categories yet.</div>';

  const swatches = SWATCHES.map(s=>`<div class="swatch ${s===newCatColor?'sel':''}" style="background:${s}" onclick="pickSwatch('${s}')"></div>`).join('');

  modal.innerHTML = `
    <button class="close-x" onclick="closeCatModal()">✕</button>
    <h3>Categories</h3>
    <div class="mdate">Add or remove sections. Drag a row to reorder.</div>
    <div class="catlist">${list}</div>
    <div class="newcat-row">
      <input id="newCatName" placeholder="e.g. Reading" maxlength="20">
    </div>
    <div class="swatch-row">${swatches}</div>
    <div class="field">
      <label>Daily hour cap for full color <span class="valtext" id="capVal">4h</span></label>
      <input type="range" min="1" max="10" step="0.5" value="4" oninput="document.getElementById('capVal').textContent=this.value+'h'">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeCatModal()">Close</button>
      <button class="btn primary" onclick="addCat()">Add category</button>
    </div>`;
}

let dragCatId = null;
function dragCatStart(ev, id){ dragCatId = id; ev.dataTransfer.effectAllowed = 'move'; ev.currentTarget.classList.add('dragging'); }
function dragCatOver(ev, overId){
  ev.preventDefault();
  if(!dragCatId || dragCatId === overId) return;
  const arr = config.categories;
  const fromIdx = arr.findIndex(c=>c.id===dragCatId);
  const toIdx = arr.findIndex(c=>c.id===overId);
  if(fromIdx<0 || toIdx<0 || fromIdx===toIdx) return;
  const [moved] = arr.splice(fromIdx,1);
  arr.splice(toIdx,0,moved);
  renderCatModal();
  const el = document.querySelector(`.catlist [data-cat-id="${dragCatId}"]`);
  if(el) el.classList.add('dragging');
}
function dragCatEnd(){
  dragCatId = null;
  saveConfig();
  render();
}
function pickSwatch(s){ newCatColor = s; renderCatModal(); }
async function addCat(){
  const nameInput = document.getElementById('newCatName');
  const name = nameInput.value.trim();
  if(!name) return;
  const capInput = document.querySelector('#catModal input[type=range]');
  const cap = parseFloat(capInput.value);
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now().toString(36).slice(-4);
  config.categories.push({id, name, color:newCatColor, max:cap});
  await saveConfig();
  render();
  renderCatModal();
}
async function removeCat(id){
  config.categories = config.categories.filter(c=>c.id!==id);
  await saveConfig();
  if(activeTab===id) activeTab='all';
  render();
  renderCatModal();
  closeCatEditor();
}

// ---- Single-category editor (opened directly from a tab's edit icon) ----
let editingCatId = null;
let editDraftColor = null;
let editDraftMax = 4;
function openCatEditDirect(id){
  const c = config.categories.find(c=>c.id===id);
  if(!c) return;
  editingCatId = id;
  editDraftColor = resolveColor(c.color);
  editDraftMax = c.max || 4;
  renderCatEditor();
  document.getElementById('catEditOverlay').classList.add('show');
}
function closeCatEditor(){ document.getElementById('catEditOverlay').classList.remove('show'); editingCatId = null; }
function renderCatEditor(){
  const c = config.categories.find(c=>c.id===editingCatId);
  if(!c) return;
  const modal = document.getElementById('catEditModal');
  modal.innerHTML = `
    <button class="close-x" onclick="closeCatEditor()">✕</button>
    <h3>Edit category</h3>
    <div class="mdate">${c.name}</div>
    <div class="field">
      <label>Name</label>
      <input type="text" id="editCatName" value="${c.name.replace(/"/g,'&quot;')}" maxlength="20" style="width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px;">
    </div>
    <div class="field">
      <label>Color</label>
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="color" id="editCatColor" value="${resolveColor(c.color)}" oninput="editDraftColor=this.value" style="width:44px; height:32px; border:none; border-radius:8px; background:none; cursor:pointer; padding:0;">
        <span style="color:var(--text-dim); font-size:12px;">Pick any color</span>
      </div>
    </div>
    <div class="field">
      <label>Daily hour cap for full color <span class="valtext" id="editCapVal">${editDraftMax}h</span></label>
      <input type="range" min="1" max="10" step="0.5" value="${editDraftMax}" oninput="editDraftMax=parseFloat(this.value); document.getElementById('editCapVal').textContent=this.value+'h'">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="deleteCatFromEditor('${c.id}')" style="color:var(--workout); border-color:var(--workout);">Delete</button>
      <button class="btn" onclick="closeCatEditor()">Cancel</button>
      <button class="btn primary" onclick="saveEditCat('${c.id}')">Save</button>
    </div>`;
}
async function saveEditCat(id){
  const nameInput = document.getElementById('editCatName');
  const name = nameInput.value.trim();
  const c = config.categories.find(c=>c.id===id);
  if(name) c.name = name;
  c.color = editDraftColor;
  c.max = editDraftMax;
  await saveConfig();
  render();
  closeCatEditor();
}
async function deleteCatFromEditor(id){
  await removeCat(id);
}

// ---- Milestone (important date) modal ----
document.getElementById('addMilestoneBtn').onclick = openMilestoneModal;
function openMilestoneModal(){
  renderMilestoneModal();
  document.getElementById('milestoneOverlay').classList.add('show');
}
function closeMilestoneModal(){ document.getElementById('milestoneOverlay').classList.remove('show'); }

function renderMilestoneModal(){
  const modal = document.getElementById('milestoneModal');
  const sorted = Object.keys(milestones).sort();
  const list = sorted.length ? sorted.map(k=>{
    const label = milestones[k];
    const niceDate = new Date(k+'T00:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
    return `<div class="row"><span class="dot" style="background:${resolveColor('var(--all)')}"></span><span class="catlabel">${niceDate} — ${label}</span><button class="icon-btn rm" onclick="removeMilestone('${k}')">✕</button></div>`;
  }).join('') : '<div style="color:var(--text-dim); font-size:13px;">No important dates yet.</div>';

  modal.innerHTML = `
    <button class="close-x" onclick="closeMilestoneModal()">✕</button>
    <h3>Important dates</h3>
    <div class="mdate">Mark deadlines, exams, launches — anything worth flagging on the grid</div>
    <div class="catlist">${list}</div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="msDate" style="width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px; font-family:'JetBrains Mono',monospace;">
    </div>
    <div class="newcat-row">
      <input id="msLabel" placeholder="e.g. Final exam" maxlength="40">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeMilestoneModal()">Close</button>
      <button class="btn primary" onclick="addMilestone()">Add date</button>
    </div>`;
}

let editingMsKey = null;
function renderMilestoneList(){
  const el = document.getElementById('msListContent');
  const todayStr = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const sorted = Object.keys(milestones).sort();
  if(!sorted.length){
    el.innerHTML = '<div class="ms-empty">No important dates yet — add one with the button above.</div>';
    return;
  }
  el.innerHTML = sorted.map(k=>{
    if(k === editingMsKey){
      return `<div class="ms-row" style="flex-direction:column; align-items:stretch; gap:8px;">
        <div style="display:flex; gap:8px;">
          <input type="date" id="msEditDate" value="${k}" style="flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:7px 9px; font-size:13px; font-family:'JetBrains Mono',monospace;">
          <input type="text" id="msEditLabel" value="${milestones[k].replace(/"/g,'&quot;')}" maxlength="40" style="flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:7px 9px; font-size:13px;">
        </div>
        <div class="edit-actions">
          <button onclick="cancelEditMs()">Cancel</button>
          <button class="save" onclick="saveEditMs('${k}')">Save</button>
        </div>
      </div>`;
    }
    const niceDate = new Date(k+'T00:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'});
    const past = k < todayStr;
    return `<div class="ms-row" style="${past?'opacity:.45;':''}">
      <span class="ms-date">${niceDate}</span>
      <span class="ms-label">${milestones[k]}</span>
      <button class="icon-btn ms-edit" onclick="startEditMs('${k}')" title="Edit">${EDIT_ICON}</button>
      <button class="ms-rm" onclick="removeMilestone('${k}')" title="Remove">✕</button>
    </div>`;
  }).join('');
}
function startEditMs(key){ editingMsKey = key; renderMilestoneList(); }
function cancelEditMs(){ editingMsKey = null; renderMilestoneList(); }
async function saveEditMs(oldKey){
  const dateInput = document.getElementById('msEditDate');
  const labelInput = document.getElementById('msEditLabel');
  const newKey = dateInput.value;
  const newLabel = labelInput.value.trim();
  if(!newKey || !newLabel) return;
  if(newKey !== oldKey) delete milestones[oldKey];
  milestones[newKey] = newLabel;
  editingMsKey = null;
  await saveMilestones();
  render();
}

async function addMilestone(){
  const dateInput = document.getElementById('msDate');
  const labelInput = document.getElementById('msLabel');
  const key = dateInput.value;
  const label = labelInput.value.trim();
  if(!key || !label) return;
  milestones[key] = label;
  await saveMilestones();
  render();
  renderMilestoneModal();
}
async function removeMilestone(key){
  delete milestones[key];
  await saveMilestones();
  render();
  renderMilestoneModal();
}

loadData();
</script>
